<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My To-Do List</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>
 
<div class="todo-wrapper">
 
  <h1 class="page-title">My To-Do List</h1>
  <p class="page-subtitle">Stay organized and productive</p>
 
  <div class="d-flex gap-2 mb-3">
    <input type="text" id="taskInput" class="form-control input-task" placeholder="Add a new task..." />
    <button class="btn btn-add" onclick="addTask()">Add</button>
  </div>
 
  <div class="d-flex justify-content-between align-items-center mb-3 flex-wrap gap-2">
    <div class="d-flex gap-2">
      <button class="btn-filter active" id="btn-all" onclick="setFilter('all')">All</button>
      <button class="btn-filter" id="btn-active" onclick="setFilter('active')">Active</button>
      <button class="btn-filter" id="btn-completed" onclick="setFilter('completed')">Completed</button>
    </div>
    <button class="btn-clear" onclick="clearCompleted()">Clear Completed</button>
  </div>
 
  <div id="taskList"></div>
 
  <div id="emptyState" class="empty-state">
    <div class="icon">☑</div>
    <p>No tasks yet. Add one above!</p>
  </div>
 
  <p class="tasks-count">
    <span id="countNum">0</span> tasks remaining
  </p>
 
</div>
 

 <script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
