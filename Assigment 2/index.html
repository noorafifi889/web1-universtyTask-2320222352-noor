<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assigment 2</title>

       <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            padding: 20px;
        }

        form {
            width: 450px;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 10px;
        }

        fieldset {
            margin-bottom: 15px;
            border-radius: 8px;
        }

        legend {
            font-weight: bold;
        }

        label {
            display: block;
            margin-top: 10px;
        }

        input, select, textarea {
            width: 100%;
            padding: 7px;
            margin-top: 5px;
        }

        .inline {
            width: auto;
        }

        button {
            width: 100%;
            padding: 10px;
            background: green;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: darkgreen;
        }
    </style>
</head>
<form action="#" method="post">

    <h2>Registration Form</h2>

    <fieldset>
        <legend>Personal Information</legend>

        <label for="name">Full Name</label>
        <input type="text" id="name" name="name" required minlength="3">

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required>

        <label for="phone">Phone Number</label>
        <input type="tel" id="phone" name="phone" required pattern="[0-9]{10}" placeholder="10 digits">

        <label for="password">Password</label>
        <input type="password" id="password" name="password"
               required minlength="6"
               pattern="(?=.*[A-Z])(?=.*[0-9]).{6,}" //validation 
               title="Must contain at least 1 uppercase letter and 1 number">

        <label for="dob">Date of Birth</label>
        <input type="date" id="dob" name="dob" required>
    </fieldset>

    <fieldset>
        <legend>Preferences</legend>

        <label for="country">Country</label>
        <select id="country" name="country" required>
            <option value="">Select</option>
            <option>Palestine</option>
            <option>Jordan</option>
            <option>Egypt</option>
        </select>

        <label>Gender</label>
        <input type="radio" id="male" name="gender" value="male" class="inline" required>
        <label for="male" class="inline">Male</label>

        <input type="radio" id="female" name="gender" value="female" class="inline">
        <label for="female" class="inline">Female</label>

        <label>Hobbies</label>
        <input type="checkbox" id="sports" name="hobbies" value="sports" class="inline">
        <label for="sports" class="inline">Sports</label>

        <input type="checkbox" id="music" name="hobbies" value="music" class="inline">
        <label for="music" class="inline">Music</label>

        <input type="checkbox" id="reading" name="hobbies" value="reading" class="inline">
        <label for="reading" class="inline">Reading</label>

        <label for="skill">Skill Level (1-10)</label>
        <input type="range" id="skill" name="skill" min="1" max="10">
    </fieldset>

</html>
